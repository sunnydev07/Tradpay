<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>TradePay - Deposit Review</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #151515; color: #f5f5f5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px; border-bottom: 1px solid #2c2c2c; background: #1c1c1c;
    }
    h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
    h1 span { color: #f2d7a5; }
    a { color: #f2d7a5; }
    main { max-width: 1100px; margin: 0 auto; padding: 22px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
    button {
      border: 1px solid #3a3a3a; background: #242424; color: #eee;
      border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2e2e2e; }
    button.primary { background: #f2d7a5; border-color: #f2d7a5; color: #1b1b1b; }
    button.danger { color: #fca5a5; border-color: #7f1d1d; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .tab.active { background: #f2d7a5; color: #1b1b1b; border-color: #f2d7a5; }
    .status { color: #9ca3af; font-size: 12px; margin-left: auto; }
    .card {
      background: #1f1f1f; border: 1px solid #2f2f2f; border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
    .who { font-weight: 700; font-size: 13px; }
    .meta { color: #9ca3af; font-size: 11px; margin-top: 3px; }
    .amount { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 18px; color: #f2d7a5; }
    .pill {
      display: inline-block; padding: 3px 9px; border-radius: 999px;
      font-size: 10px; font-weight: 700; text-transform: capitalize; margin-left: 6px;
    }
    .pill.pending { background: rgba(245, 158, 11, .16); color: #fbbf24; }
    .pill.completed { background: rgba(16, 185, 129, .16); color: #34d399; }
    .pill.rejected { background: rgba(239, 68, 68, .16); color: #f87171; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .empty, .error { text-align: center; color: #9ca3af; padding: 50px 10px; font-size: 13px; }
    .error strong { color: #f87171; display: block; margin-bottom: 8px; }
    #toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #f2d7a5; color: #1b1b1b; padding: 9px 16px; border-radius: 10px;
      font-size: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>TradePay <span>Deposit Review</span></h1>
    <a href="/">Back to app</a>
  </header>

  <main>
    <div class="bar">
      <button class="tab active" data-status="">All</button>
      <button class="tab" data-status="pending">Pending</button>
      <button class="tab" data-status="completed">Completed</button>
      <button class="tab" data-status="rejected">Rejected</button>
      <button id="refresh">Refresh</button>
      <span class="status" id="status">Checking access...</span>
    </div>
    <div id="list" class="empty">Loading deposits...</div>
  </main>

  <div id="toast" role="status"></div>

  <script>
    const token = localStorage.getItem('tradepay_token') || '';
    const list = document.getElementById('list');
    const statusEl = document.getElementById('status');
    let activeStatus = '';

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {}),
          ...(options.headers || {})
        }
      });
      const json = await res.json().catch(() => ({}));
      return { res, json };
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(deposits) {
      list.textContent = '';
      if (!deposits.length) {
        list.className = 'empty';
        list.textContent = 'No deposits in this view.';
        return;
      }
      list.className = '';

      for (const d of deposits) {
        const card = el('div', 'card');
        const row = el('div', 'row');

        const left = el('div');
        const who = el('div', 'who', d.user?.nickname || d.user?.phone || d.userId || 'Unknown user');
        who.appendChild(el('span', 'pill ' + d.status, d.status));
        left.appendChild(who);
        left.appendChild(el('div', 'meta', 'UTR ' + d.utr + '  •  QR ' + (d.vpa || d.qrId)));
        left.appendChild(el('div', 'meta', 'Submitted ' + new Date(d.createdAt).toLocaleString() +
          (d.verifiedAt ? '  •  Verified ' + new Date(d.verifiedAt).toLocaleString() : '') +
          (d.rejectReason ? '  •  ' + d.rejectReason : '')));

        const right = el('div');
        right.appendChild(el('div', 'amount', '₹' + Number(d.amount).toFixed(2)));
        if (d.user?.phone) right.appendChild(el('div', 'meta', d.user.phone));
        right.appendChild(el('div', 'meta', 'Deposit ' + d.id));

        row.appendChild(left);
        row.appendChild(right);
        card.appendChild(row);

        if (d.status === 'pending') {
          const actions = el('div', 'actions');
          const approve = el('button', 'primary', 'Approve & Credit');
          const reject = el('button', 'danger', 'Reject');
          approve.addEventListener('click', () => review(d.id, 'approve'));
          reject.addEventListener('click', () => review(d.id, 'reject'));
          actions.appendChild(approve);
          actions.appendChild(reject);
          card.appendChild(actions);
        }

        list.appendChild(card);
      }
    }

    async function review(depositId, action) {
      if (action === 'approve' && !confirm('Approve this deposit and credit the user exactly once?')) return;
      let reason = '';
      if (action === 'reject') {
        reason = prompt('Reason for rejecting this deposit:', 'UTR could not be verified');
        if (reason === null) return;
      }

      try {
        const { json } = await api('/app/admin/deposits/' + action, {
          method: 'POST',
          body: JSON.stringify({ depositId, reason })
        });
        toast(json.msg || (json.code === 1000 ? 'Updated' : 'Update failed'));
        await load(activeStatus);
      } catch (e) {
        toast('Network error; please retry');
      }
    }

    async function load(status) {
      activeStatus = status;
      statusEl.textContent = 'Loading...';
      const query = status ? '?status=' + encodeURIComponent(status) : '';
      const { res, json } = await api('/app/admin/deposits' + query);

      if (res.status === 401 || res.status === 403) {
        list.className = 'error';
        list.textContent = '';
        list.appendChild(el('strong', '', 'Admin access required'));
        list.appendChild(el('span', '', 'Sign in with an administrator account, then reload this page.'));
        statusEl.textContent = '';
        return;
      }
      if (json.code !== 1000) {
        list.className = 'error';
        list.textContent = json.msg || 'Unable to load deposits.';
        statusEl.textContent = '';
        return;
      }

      statusEl.textContent = json.data.total + ' deposit(s)';
      render(json.data.records || []);
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        load(tab.dataset.status || '');
      });
    });
    document.getElementById('refresh').addEventListener('click', () => load(activeStatus));

    (async function init() {
      if (!token) {
        list.className = 'error';
        list.textContent = '';
        list.appendChild(el('strong', '', 'Sign in required'));
        list.appendChild(el('span', '', 'Open the main app and sign in as an administrator first.'));
        statusEl.textContent = '';
        return;
      }

      const { res, json } = await api('/app/user/info');
      if (res.status === 401 || !json.data || !json.data.isAdmin) {
        list.className = 'error';
        list.textContent = '';
        list.appendChild(el('strong', '', 'Admin access required'));
        list.appendChild(el('span', '', 'This account is not listed in ADMIN_USER_IDS.'));
        statusEl.textContent = '';
        return;
      }

      await load('');
    })();
  </script>
</body>
</html>

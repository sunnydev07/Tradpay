services:
  - type: web
    name: tradepay-engine
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # Persistent disks require a paid Render plan (Starter or higher).
    # On a paid plan, uncomment the disk block below and set TRADEPAY_DB_FILE=/var/data/db.json:
    # disk:
    #   name: tradepay-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      # - key: TRADEPAY_DB_FILE
      #   value: /var/data/db.json
      # Optional until a PSP is connected; set it in the dashboard to enable
      # signed /webhooks/payment reconciliation.
      # - key: PAYMENT_WEBHOOK_SECRET
      #   sync: false

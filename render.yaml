services:
  - type: web
    name: tradepay-engine
    runtime: node
    # Free Render instances have an ephemeral filesystem. Durable state is kept
    # in Supabase instead of a mounted disk, so the free plan is sufficient.
    # For higher write volume or paid hosting, a mounted disk remains supported.
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRADEPAY_STATE_BACKEND
        value: supabase
      # Auth project. These stay pointed at the project that holds existing
      # Supabase Auth users; changing them invalidates current logins.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Server-only. Used for Auth admin metadata sync. Optional when a
      # dedicated state project is configured below.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Dedicated state project. The authoritative ledger snapshot lives here.
      # SUPABASE_STATE_URL and its service key are server-only.
      - key: SUPABASE_STATE_URL
        sync: false
      - key: SUPABASE_STATE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      # Required in production: at least 32 random characters. The server
      # refuses to start if this is missing, short, or the old default key.
      # Generate one with: openssl rand -hex 32
      - key: ADMIN_KEY
        sync: false
      # Optional until a PSP is connected; set it in the dashboard to enable
      # signed /webhooks/payment reconciliation.
      # - key: PAYMENT_WEBHOOK_SECRET
      #   sync: false
      # USDT deposits stay disabled until a real receiving address is added for
      # at least one network. Placeholder or malformed addresses are ignored.
      # - key: USDT_TRC20_ADDRESS
      #   sync: false
      # - key: USDT_BSC_ADDRESS
      #   sync: false
      # - key: USDT_POLYGON_ADDRESS
      #   sync: false
      # Only use this for disposable preview environments. Production refuses
      # to start without durable state unless this is explicitly true.
      # - key: ALLOW_EPHEMERAL_STORAGE
      #   value: "true"
